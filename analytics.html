        const firebaseConfig = {

            authDomain: "poslavamex.firebaseapp.com",
            projectId: "poslavamex",
            storageBucket: "poslavamex.firebasestorage.app",

        const app = initializeApp(firebaseConfig);

        // --- Helpers ---
        const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);
        const formatInt = (val) => new Intl.NumberFormat('es-MX').format(Math.round(val));
        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#82ca9d', '#ef4444'];
        const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        // Categorías de gastos — debe coincidir con EXPENSE_CATEGORIES en index.html
        const EXPENSE_CATEGORIES = [
            { id: 'PIPAS', label: 'Pipas de agua' },
            { id: 'JMAS', label: 'JMAS (Agua)' },
            { id: 'IMSS', label: 'IMSS' },
            { id: 'SAMS', label: "Sam's / Insumos" },
            { id: 'ARMORALL', label: 'ArmorAll' },
            { id: 'SAT', label: 'Impuestos / SAT' },
            { id: 'CONTADOR', label: 'Contador' },
            { id: 'VEHICULO', label: 'Vehículo / Reparaciones' },
            { id: 'CORTESIA', label: 'Lavadas Cortesía' },
            { id: 'JABON', label: 'Jabón / Químicos' },
            { id: 'CFE', label: 'Electricidad CFE' },
            { id: 'BASURA', label: 'Basura' },
            { id: 'AVANCES', label: 'Avances (anticipos nómina)' },
            { id: 'VACACIONES', label: 'Vacaciones' },
            { id: 'OTROS', label: 'Otros' },
            { id: 'CHOQUE', label: 'Choque Pagado', extraordinary: true },
            { id: 'DEMANDA', label: 'Demanda / Legal', extraordinary: true },
            { id: 'MULTA', label: 'Multa', extraordinary: true },
            { id: 'FINIQUITO', label: 'Finiquitos / Renuncias', extraordinary: true },
        ];
        const CAT_BY_ID = Object.fromEntries(EXPENSE_CATEGORIES.map(c => [c.id, c]));

        // Para gastos históricos sin categoría: clasificación por palabra clave en la descripción.
        // El orden importa (MULTA antes que JMAS para que "multa jmas" caiga en extraordinarios).
        const KEYWORD_RULES = [
            ['PIPAS', /pipa/i],
            ['MULTA', /multa/i],
            ['JMAS', /jmas/i],
            ['IMSS', /imss/i],
            ['SAMS', /sam'?s|costco/i],
            ['ARMORALL', /armor\s*-?\s*all/i],
            ['SAT', /\bsat\b|impuesto/i],
            ['CONTADOR', /contador|contabil/i],
            ['VEHICULO', /veh[ií]culo|camioneta|taller|reparaci|llanta|mec[aá]nic/i],
            ['CORTESIA', /cortes[ií]a/i],
            ['JABON', /jab[oó]n|shampoo|qu[ií]mico/i],
            ['CFE', /\bcfe\b|el[eé]ctric|\bluz\b/i],
            ['BASURA', /basura/i],
            ['AVANCES', /avance|anticipo/i],
            ['VACACIONES', /vacacion/i],
            ['FINIQUITO', /finiquito|renuncia|liquidaci/i],
            ['DEMANDA', /demanda|abogado|legal/i],
            ['CHOQUE', /choque|colisi/i],
        ];
        const categorizeExpense = (e) => {
            if (e.category && CAT_BY_ID[e.category]) return e.category;
            const desc = e.description || e.note || e.concept || '';
            for (const [id, rx] of KEYWORD_RULES) if (rx.test(desc)) return id;
            return 'OTROS';
        };

        // Ids equivalentes de extras rápidos de caja → extra canónico
        const EXTRA_CANON = { QA_PINO: 'PINO', QA_BOLEADA: 'BOLEADA' };
        const EXTRA_LABELS = {
            PINO: 'Pino', BOLEADA: 'Boleada', MOTOR: 'Lavado Motor', CHASIS: 'Chasis',
            AROMA: 'Aroma', ARMORALL: 'Armor-All', LIMP_FOCOS: 'Limpieza de Focos',
            ASPIRADO_CAJUELA: 'Aspirado de Cajuela', LIMP_ZONA: 'Limpieza por Zona', SNACKS: 'Snacks',
            RZR_CHICO: 'Razer Chico', RZR_GRANDE: 'Razer Grande'
        };
        const KNOWN_EXTRA_IDS = new Set(['MOTOR', 'CHASIS', 'AROMA', 'ARMORALL', 'LIMP_FOCOS', 'ASPIRADO_CAJUELA', 'BOLEADA', 'LIMP_ZONA', 'PINO', 'SNACKS', 'RZR_CHICO', 'RZR_GRANDE']);

        // Los extras capturados a mano en "Varios" llevan id VARIOS-<timestamp> y el texto
        // que escribió el usuario como label. Se doblan al extra canónico por nombre.
        const normText = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
        const levenshtein = (a, b) => {
            if (a === b) return 0;
            const m = a.length, n = b.length;
            if (!m) return n;
            if (!n) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[n];
        };
        // Palabras de <=4 letras exigen coincidencia exacta; 5-7 toleran 1 error de dedo; 8+ toleran 2.
        const fuzzyWordMatch = (word, keyword) => {
            if (word === keyword) return true;
            if (keyword.length <= 4) return false;
            return levenshtein(word, keyword) <= (keyword.length >= 8 ? 2 : 1);
        };
        const EXTRA_KEYWORDS = [
            ['BOLEADA', ['boleada', 'boleadas']],
            ['PINO', ['pino', 'pinos']],
            ['SNACKS', ['snack', 'snacks']],
            ['MOTOR', ['motor']],
            ['CHASIS', ['chasis', 'chassis']],
            ['ARMORALL', ['armorall', 'armor']],
            ['LIMP_FOCOS', ['focos', 'foco']],
            ['ASPIRADO_CAJUELA', ['cajuela']],
            ['LIMP_ZONA', ['zona']],
            ['AROMA', ['aroma', 'aromas']],
        ];
        const RZR_KEYWORDS = ['rzr', 'razer', 'razr', 'raser', 'racer'];
        const matchExtraAlias = (label, price) => {
            const n = normText(label);
            if (!n) return null;
            const words = n.split(' ');
            const has = (kw) => words.some(w => fuzzyWordMatch(w, kw));
            // "moto(s)" está a 1 letra de "motor" pero es otra cosa: no auto-corregir
            const isMoto = words.some(w => w === 'moto' || w === 'motos' || w === 'motocicleta');
            if (RZR_KEYWORDS.some(has)) {
                if (has('grande') || has('grandes') || words.includes('gde')) return 'RZR_GRANDE';
                if (has('chico') || has('chica')) return 'RZR_CHICO';
                return (typeof price === 'number' && !isNaN(price) && Math.abs(price - 800) < Math.abs(price - 640)) ? 'RZR_GRANDE' : 'RZR_CHICO';
            }
            for (const [id, kws] of EXTRA_KEYWORDS) {
                if (id === 'MOTOR' && isMoto) continue;
                if (kws.some(has)) return id;
            }
            return null;
        };

        const CustomDateRangePicker = ({ startDate, endDate, setStartDate, setEndDate }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [hoverDateStr, setHoverDateStr] = useState(null);
            const pickerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (pickerRef.current && !pickerRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const shortFmt = (dStr) => {
                if (!dStr) return '';
                const [y, m, d] = dStr.split('-');
                return `${d} ${MONTHS[parseInt(m) - 1].substring(0, 3)} ${y}`;
            };

            const nextMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1));
            const prevMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1));

            const handleDayClick = (date) => {
                if (!date) return;
                const dateStr = fmt(date);
                const time = date.getTime();
                const sTime = startDate ? new Date(startDate + 'T00:00:00').getTime() : null;
                const eTime = endDate ? new Date(endDate + 'T00:00:00').getTime() : null;

                if (!sTime || (sTime && eTime) || time < sTime) {
                    setStartDate(dateStr);
                    setEndDate('');
                } else {
                    setEndDate(dateStr);
                    setIsOpen(false);
                }
            };

            const renderMonth = (offset) => {
                const d = new Date(viewDate.getFullYear(), viewDate.getMonth() + offset, 1);
                const year = d.getFullYear();
                const month = d.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDay = new Date(year, month, 1).getDay();

                const days = Array(startDay).fill(null);
                for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));

                return (
                    <div className="flex-1 w-64 select-none">
                        <div className="text-center font-bold text-slate-700 mb-4">{MONTHS[month]} {year}</div>
                        <div className="grid grid-cols-7 gap-y-1 text-center text-xs font-bold text-slate-400 mb-2">
                            {['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'].map(day => <div key={day}>{day}</div>)}
                        </div>
                        <div className="grid grid-cols-7 gap-y-1 text-center text-sm">
                            {days.map((date, i) => {
                                if (!date) return <div key={i} className="h-9"></div>;
                                const dStr = fmt(date);
                                const dTime = date.getTime();
                                const sTime = startDate ? new Date(startDate + 'T00:00:00').getTime() : null;
                                const eTime = endDate ? new Date(endDate + 'T00:00:00').getTime() : null;
                                const hTime = hoverDateStr ? new Date(hoverDateStr + 'T00:00:00').getTime() : null;

                                const isStart = startDate === dStr;
                                const isEnd = endDate === dStr;
                                const isBetween = sTime && eTime && dTime > sTime && dTime < eTime;
                                const isHoverBetween = sTime && !eTime && hTime && dTime > sTime && dTime <= hTime;

                                const bgClass = isBetween || isHoverBetween ? 'bg-blue-50' : '';
                                let roundedClass = '';
                                if (isStart && (eTime || hTime)) roundedClass = 'rounded-l-full bg-blue-50';
                                if (isEnd || (isHoverBetween && dStr === hoverDateStr)) roundedClass = 'rounded-r-full bg-blue-50';
                                if (isStart && isEnd) roundedClass = 'rounded-full';

                                return (
                                    <div key={i} className={`h-9 flex items-center justify-center cursor-pointer ${roundedClass} ${bgClass}`}
                                        onMouseEnter={() => setHoverDateStr(dStr)}
                                        onClick={() => handleDayClick(date)}>
                                        <div className={`w-9 h-9 flex items-center justify-center rounded-full transition-colors ${isStart || isEnd ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-700 hover:bg-slate-200'}`}>
                                            {date.getDate()}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="relative" ref={pickerRef}>
                    <button onClick={() => setIsOpen(!isOpen)} className="flex items-center gap-2 border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm min-w-[220px] justify-between h-10">
                        <div className="flex items-center gap-2 truncate">
                            <Calendar size={16} className="text-blue-500 shrink-0" />
                            {startDate ? `${shortFmt(startDate)} ${endDate ? '- ' + shortFmt(endDate) : '...'}` : 'Seleccionar fechas'}
                        </div>
                    </button>
                    {isOpen && (
                        <div className="absolute top-full right-0 mt-2 bg-white rounded-2xl shadow-xl border border-slate-200 p-5 z-50 flex flex-col md:flex-row gap-8 origin-top-right transition-all">
                            <div className="absolute top-4 left-4 cursor-pointer p-1.5 hover:bg-slate-100 text-slate-500 rounded-full transition-colors" onClick={prevMonth}><ChevronLeft size={20} /></div>
                            <div className="absolute top-4 right-4 cursor-pointer p-1.5 hover:bg-slate-100 text-slate-500 rounded-full transition-colors" onClick={nextMonth}><ChevronRight size={20} /></div>
                            {renderMonth(0)}
                            <div className="hidden md:block w-px bg-slate-100"></div>
                            <div className="hidden md:block">{renderMonth(1)}</div>
                        </div>
                    )}
                </div>
            );
        };

        const KPICard = ({ title, value, subtext, icon: Icon, trend, color = "blue" }) => {
            const colorClasses = {
                blue: "bg-blue-100 text-blue-600",
                green: "bg-green-100 text-green-600",
                red: "bg-red-100 text-red-600",
                orange: "bg-orange-100 text-orange-600",
                purple: "bg-purple-100 text-purple-600",
                indigo: "bg-indigo-100 text-indigo-600",
                pink: "bg-pink-100 text-pink-600",
                cyan: "bg-cyan-100 text-cyan-600",
            };

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <div className="flex justify-between items-start mb-4">
                        <div className={`p-3 rounded-lg ${colorClasses[color] || colorClasses.blue}`}>
                            <Icon size={24} />
                        </div>
                        {trend && (
                            <span className={`flex items-center text-sm font-bold ${trend === 'up' ? 'text-green-500' : 'text-red-500'}`}>
                                {trend === 'up' ? <ArrowUpRight size={16} /> : <ArrowDownRight size={16} />}
                            </span>
                        )}
                    </div>
                    <h3 className="text-slate-500 text-sm font-medium mb-1 uppercase tracking-wide">{title}</h3>
                    <div className="text-3xl font-bold text-slate-800 mb-1">{value}</div>
                    {subtext && <div className="text-slate-400 text-xs">{subtext}</div>}
                </div>
            );
        };

        const AnalyticsDashboard = () => {
            // Authentication State
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');

            // Data State
            const [tickets, setTickets] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [bizExpenses, setBizExpenses] = useState([]);
            const [cashCounts, setCashCounts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [attendance, setAttendance] = useState([]);
            const [deductions, setDeductions] = useState([]);
            const [loading, setLoading] = useState(true);

            // Filter State
            const [dateFilterType, setDateFilterType] = useState('MONTH');
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            useEffect(() => {
                if (!isAuthenticated) return;

                const fetchData = async () => {
                    try {
                        const ticketsPromise = getDocs(query(collection(db, "tickets"), orderBy("timestamp", "desc")));
                        const expensesPromise = getDocs(query(collection(db, "expenses"), orderBy("timestamp", "desc")));
                        const bizExpPromise = getDocs(query(collection(db, "business_expenses"), orderBy("timestamp", "desc")));
                        const cashCountsPromise = getDocs(query(collection(db, "cash_counts"), orderBy("timestamp", "desc")));
                        const empPromise = getDocs(query(collection(db, "employees")));
                        const attendancePromise = getDocs(collection(db, "attendance"));
                        const deductionsPromise = getDocs(query(collection(db, "deductions"), orderBy("timestamp", "desc")));

                        const [tSnap, eSnap, beSnap, ccSnap, empSnap, attSnap, dedSnap] = await Promise.all([ticketsPromise, expensesPromise, bizExpPromise, cashCountsPromise, empPromise, attendancePromise, deductionsPromise]);

                        setTickets(tSnap.docs.map(d => ({ id: d.id, ...d.data(), date: d.data().timestamp?.toDate() || new Date() })).filter(t => t.status === 'PAID' || t.status === 'ARCHIVED'));
                        setExpenses(eSnap.docs.map(d => ({ id: d.id, ...d.data(), date: d.data().timestamp?.toDate() || new Date() })).filter(e => e.status === 'APPROVED'));
                        setBizExpenses(beSnap.docs.map(d => ({ id: d.id, ...d.data(), date: d.data().timestamp?.toDate() || new Date() })));
                        setCashCounts(ccSnap.docs.map(d => ({ id: d.id, ...d.data(), date: d.data().timestamp?.toDate() || new Date() })));
                        setEmployees(empSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setAttendance(attSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setDeductions(dedSnap.docs.map(d => ({ id: d.id, ...d.data(), date: d.data().timestamp?.toDate() || new Date() })).filter(d => d.status !== 'REJECTED'));

                    } catch (err) {
                        console.error(err);
                        alert("Error cargando datos");
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, [isAuthenticated]);

            const availableYears = useMemo(() => {
                if (!tickets.length) return [new Date().getFullYear()];
                const years = new Set(tickets.map(t => t.date.getFullYear()));
                return Array.from(years).sort((a, b) => b - a);
            }, [tickets]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === 'covington521') {
                    setIsAuthenticated(true);
                } else {
                    alert('Contraseña incorrecta');
                    setPasswordInput('');
                }
            };

            const processed = useMemo(() => {
                if (tickets.length === 0) return null;

                const filterDate = (item) => {
                    if (dateFilterType === 'ALL') return true;
                    if (dateFilterType === 'YEAR') return item.date.getFullYear() === selectedYear;
                    if (dateFilterType === 'MONTH') return item.date.getMonth() === selectedMonth && item.date.getFullYear() === selectedYear;
                    if (dateFilterType === 'CUSTOM') {
                        const itemTime = item.date.getTime();
                        let start = 0;
                        let end = Infinity;

                        if (startDate) {
                            const [y, m, d] = startDate.split('-');
                            start = new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
                        }
                        if (endDate) {
                            const [y, m, d] = endDate.split('-');
                            end = new Date(y, m - 1, d, 23, 59, 59, 999).getTime();
                        }
                        return itemTime >= start && itemTime <= end;
                    }
                    return true;
                };

                const fTickets = tickets.filter(filterDate);
                const fExpenses = expenses.filter(filterDate);
                const fBizExpenses = bizExpenses.filter(filterDate);
                const fCashCounts = cashCounts.filter(filterDate);
                const fDeductions = deductions.filter(filterDate);

                // --- 1. Financials ---
                const totalRevenue = fTickets.reduce((acc, t) => acc + (t.price || 0), 0);
                const laborCommission = fTickets.reduce((acc, t) => acc + (t.commission || 0), 0);

                const salariedEmployees = employees.filter(e => e.active && (parseFloat(e.baseSalary) || 0) > 0);
                const weeklyFixedLabor = salariedEmployees.reduce((acc, e) => acc + (parseFloat(e.baseSalary) || 0), 0);
                const salariedCount = salariedEmployees.length;

                const activeSupervisors = employees.filter(e => e.active && (e.role === 'SUPERVISOR' || e.isSupervisor === true));

                let daysInRange = 1;
                if (fTickets.length > 0) {
                    const dates = fTickets.map(t => t.date);
                    const minD = new Date(Math.min(...dates));
                    const maxD = new Date(Math.max(...dates));
                    daysInRange = Math.max(1, Math.ceil((maxD - minD) / (1000 * 60 * 60 * 24)) + 1);
                }
                const laborSalary = (weeklyFixedLabor / 7) * daysInRange;

                const supervisorSalesCommTotal = activeSupervisors.reduce((acc, emp) => {
                    const pct = parseFloat(emp.commissionPct) || parseFloat(emp.commissionPercent) || 0;
                    return acc + (totalRevenue * (pct / 100));
                }, 0);

                let totalBoleadaRevenue = 0;
                fTickets.forEach(t => {
                    if (t.extras && Array.isArray(t.extras)) {
                        t.extras.forEach(e => {
                            if (['BOLEADA', 'QA_BOLEADA'].includes(e.id)) {
                                totalBoleadaRevenue += (e.price || 0);
                            }
                        });
                    }
                });

                const activeBoleros = employees.filter(e => e.active && e.role === 'BOLERO');
                const boleroCommTotal = activeBoleros.reduce((acc, emp) => {
                    const pct = parseFloat(emp.commissionPct) || 50;
                    return acc + (totalBoleadaRevenue * (pct / 100));
                }, 0);

                const totalLabor = laborCommission + laborSalary + supervisorSalesCommTotal + boleroCommTotal;
                const operationalExp = fExpenses.filter(e => !e.gastoAjeno).reduce((acc, e) => acc + (e.amount || 0), 0);
                const adminExp = fBizExpenses.reduce((acc, e) => acc + (e.amount || 0), 0);
                const totalOpExpenses = operationalExp + adminExp;

                const totalExpenses = totalLabor + totalOpExpenses;
                const netProfit = totalRevenue - totalExpenses;

                const profitMarginPct = totalRevenue > 0 ? (netProfit / totalRevenue) * 100 : 0;
                const totalLaborPct = totalRevenue > 0 ? (totalLabor / totalRevenue) * 100 : 0;
                const totalOpExpensesPct = totalRevenue > 0 ? (totalOpExpenses / totalRevenue) * 100 : 0;

                const laborCommPct = totalRevenue > 0 ? (laborCommission / totalRevenue) * 100 : 0;
                const laborSupCommPct = totalRevenue > 0 ? (supervisorSalesCommTotal / totalRevenue) * 100 : 0;
                const laborBoleroCommPct = totalRevenue > 0 ? (boleroCommTotal / totalRevenue) * 100 : 0;
                const laborSalaryPct = totalRevenue > 0 ? (laborSalary / totalRevenue) * 100 : 0;

                const avgTicket = totalRevenue / (fTickets.length || 1);
                const avgTicketsPerDay = fTickets.length > 0 ? fTickets.length / daysInRange : 0;

                const allExpensesForPeriod = [...fExpenses.filter(e => !e.gastoAjeno), ...fBizExpenses];

                // --- Estructura de gastos por categoría (usa e.category o clasificación por palabra clave) ---
                const catAgg = {};
                allExpensesForPeriod.forEach(e => {
                    const catId = categorizeExpense(e);
                    const cat = catAgg[catId] || (catAgg[catId] = {
                        id: catId, label: CAT_BY_ID[catId].label,
                        extraordinary: !!CAT_BY_ID[catId].extraordinary, count: 0, amount: 0
                    });
                    cat.count += 1;
                    cat.amount += (parseFloat(e.amount) || 0);
                });
                const expenseCategories = Object.values(catAgg).filter(c => !c.extraordinary).sort((a, b) => b.amount - a.amount);
                const extraordinaryCategories = Object.values(catAgg).filter(c => c.extraordinary).sort((a, b) => b.amount - a.amount);
                const extraordinaryTotal = extraordinaryCategories.reduce((acc, c) => acc + c.amount, 0);
                const operatingExpenses = totalOpExpenses - extraordinaryTotal;
                const operatingExpensesPct = totalRevenue > 0 ? (operatingExpenses / totalRevenue) * 100 : 0;
                const extraordinaryPct = totalRevenue > 0 ? (extraordinaryTotal / totalRevenue) * 100 : 0;

                const totalArmorAllCost = catAgg['ARMORALL']?.amount || 0;
                const armorAllPerWash = fTickets.length > 0 ? totalArmorAllCost / fTickets.length : 0;

                const topGastos = allExpensesForPeriod
                    .sort((a, b) => (parseFloat(b.amount) || 0) - (parseFloat(a.amount) || 0))
                    .slice(0, 10);

                const avgDailyRevenue = totalRevenue / daysInRange;
                const avgMonthlyRevenue = avgDailyRevenue * 30.44;

                // --- 2. Trends (Monthly) ---
                const monthlyStats = {};
                const getMonthObj = (date) => {
                    const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    if (!monthlyStats[key]) monthlyStats[key] = { name: key, revenue: 0, expenses: 0, profit: 0, labor: 0, tickets: 0 };
                    return monthlyStats[key];
                }

                fTickets.forEach(t => { const m = getMonthObj(t.date); m.revenue += (t.price || 0); m.labor += (t.commission || 0); m.tickets += 1; });
                fExpenses.filter(e => !e.gastoAjeno).forEach(e => { const m = getMonthObj(e.date); m.expenses += (e.amount || 0); });
                fBizExpenses.forEach(e => { const m = getMonthObj(e.date); m.expenses += (e.amount || 0); });

                Object.values(monthlyStats).forEach(m => {
                    m.profit = m.revenue - m.expenses - m.labor;
                    m.profitMargin = m.revenue > 0 ? (m.profit / m.revenue) * 100 : 0;
                    m.avgTicket = m.tickets > 0 ? m.revenue / m.tickets : 0;
                    const [y, mo] = m.name.split('-');
                    m.label = `${MONTHS[parseInt(mo) - 1]} ${y}`;
                });
                const chartFinancials = Object.values(monthlyStats).sort((a, b) => a.name.localeCompare(b.name));

                // --- Mezcla de Servicios ---
                const serviceAgg = {};
                fTickets.forEach(t => {
                    const id = t.service?.id || 'SIN_SERVICIO';
                    const label = t.service?.label || 'Solo extras / Caja';
                    const s = serviceAgg[id] || (serviceAgg[id] = { id, label, tickets: 0, revenue: 0 });
                    s.tickets += 1;
                    s.revenue += (t.price || 0);
                });
                const serviceMix = Object.values(serviceAgg).map(s => ({
                    ...s,
                    pctTickets: fTickets.length ? (s.tickets / fTickets.length) * 100 : 0,
                    pctRevenue: totalRevenue > 0 ? (s.revenue / totalRevenue) * 100 : 0
                })).sort((a, b) => b.tickets - a.tickets);

                // --- Tamaño de Vehículo ---
                const sizeAgg = {};
                fTickets.forEach(t => {
                    if (!t.size?.id) return;
                    const s = sizeAgg[t.size.id] || (sizeAgg[t.size.id] = { id: t.size.id, label: t.size.label || t.size.id, tickets: 0, revenue: 0 });
                    s.tickets += 1;
                    s.revenue += (t.price || 0);
                });
                const sizedTickets = Object.values(sizeAgg).reduce((acc, s) => acc + s.tickets, 0);
                const sizeMix = Object.values(sizeAgg).map(s => ({
                    ...s,
                    avgTicket: s.tickets ? s.revenue / s.tickets : 0,
                    pctTickets: sizedTickets ? (s.tickets / sizedTickets) * 100 : 0,
                    pctRevenue: totalRevenue > 0 ? (s.revenue / totalRevenue) * 100 : 0
                })).sort((a, b) => b.revenue - a.revenue);

                // --- Descripciones de vehículo más frecuentes ---
                const descAgg = {};
                fTickets.forEach(t => {
                    const raw = (t.vehicleDesc || '').trim().replace(/\s+/g, ' ');
                    if (!raw) return;
                    const key = raw.toLowerCase();
                    const d = descAgg[key] || (descAgg[key] = { label: raw, tickets: 0 });
                    d.tickets += 1;
                });
                const topVehicles = Object.values(descAgg).sort((a, b) => b.tickets - a.tickets).slice(0, 10);

                // --- Extras y Upsell ---
                const extraAgg = {};
                const manualAgg = {};
                let ticketsWithExtras = 0;
                let extrasRevenue = 0;
                fTickets.forEach(t => {
                    const exs = Array.isArray(t.extras) ? t.extras : [];
                    if (exs.length > 0) ticketsWithExtras += 1;
                    exs.forEach(e => {
                        let id = EXTRA_CANON[e.id] || e.id || 'OTRO';
                        let manual = false;
                        // Capturas manuales ("Varios") o ids desconocidos: doblar al extra canónico por nombre
                        if (!KNOWN_EXTRA_IDS.has(id)) {
                            manual = true;
                            const aliasId = matchExtraAlias(e.label, e.price);
                            id = aliasId || ('MANUAL:' + normText(e.label));
                            const mKey = normText(e.label);
                            const m = manualAgg[mKey] || (manualAgg[mKey] = { label: (e.label || '').trim() || '(sin texto)', matchedId: aliasId, count: 0, revenue: 0 });
                            m.count += 1;
                            m.revenue += (e.price || 0);
                        }
                        const x = extraAgg[id] || (extraAgg[id] = { id, label: EXTRA_LABELS[id] || e.label || id, count: 0, revenue: 0, manualCount: 0 });
                        x.count += 1;
                        x.revenue += (e.price || 0);
                        if (manual) x.manualCount += 1;
                        extrasRevenue += (e.price || 0);
                    });
                });
                const extrasMix = Object.values(extraAgg).map(x => ({
                    ...x,
                    avgPrice: x.count ? x.revenue / x.count : 0
                })).sort((a, b) => b.revenue - a.revenue);
                const manualExtras = Object.values(manualAgg).sort((a, b) => b.revenue - a.revenue);
                const manualExtrasTotal = manualExtras.reduce((acc, m) => acc + m.revenue, 0);
                const upsellRate = fTickets.length ? (ticketsWithExtras / fTickets.length) * 100 : 0;
                const extraPerTicket = fTickets.length ? extrasRevenue / fTickets.length : 0;

                // --- Programa de Snacks (clientes vs. lavadores; misma lógica que el Corte) ---
                const snacks = { customerCount: 0, customerMoney: 0, internalCount: 0, internalMoney: 0 };
                fTickets.forEach(t => {
                    if (t.snackCount > 0) {
                        snacks.customerCount += t.snackCount;
                        const extrasTotal = (t.extras || []).reduce((a, b) => a + (b.price || 0), 0);
                        snacks.customerMoney += Math.max(0, (t.price || 0) - (t.basePrice || 0) - extrasTotal);
                    }
                });
                fDeductions.forEach(d => {
                    const desc = (d.description || '').toLowerCase().trim();
                    if (desc === 'snack' || desc === 'snacks') {
                        snacks.internalCount += 1;
                        snacks.internalMoney += (d.amount || 0);
                    }
                });

                // --- Daily Trends ---
                const dailyStats = {};
                fTickets.forEach(t => {
                    const dStr = new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short' }).format(t.date);
                    if (!dailyStats[dStr]) {
                        dailyStats[dStr] = { dateLabel: dStr, sortKey: t.date.getTime(), tickets: 0, venta: 0, pinos: 0, snacks: 0 };
                    }
                    const ds = dailyStats[dStr];
                    ds.tickets += 1;
                    ds.venta += (t.price || 0);
                    ds.snacks += (t.snackCount || 0);

                    if (t.extras && Array.isArray(t.extras)) {
                        t.extras.forEach(e => {
                            if (['PINO', 'QA_PINO'].includes(e.id)) {
                                ds.pinos += 1;
                            }
                        });
                    }
                });
                const chartDailyTrends = Object.values(dailyStats).sort((a, b) => a.sortKey - b.sortKey);

                // --- 3. Expense Composition ---
                const chartExpenses = [
                    { name: 'Comisión Lavadores', value: laborCommission },
                    { name: 'Comisión Supervisores', value: supervisorSalesCommTotal },
                    { name: 'Comisión Bolero', value: boleroCommTotal },
                    { name: 'Salarios Base', value: laborSalary },
                    { name: 'Gastos Operativos', value: operationalExp },
                    { name: 'Gastos Admin', value: adminExp }
                ].filter(i => i.value > 0);

                // --- 4. Employee Revenue Performance ---
                const empStats = {};
                fTickets.forEach(t => {
                    const washers = t.washers || (t.washer ? [t.washer] : []);
                    const commShare = (t.commission || 0) / Math.max(washers.length, 1);
                    const revShare = (t.price || 0) / Math.max(washers.length, 1);
                    washers.forEach(w => {
                        if (!empStats[w]) empStats[w] = { name: w, tickets: 0, commission: 0, revenueServed: 0 };
                        empStats[w].tickets += 1;
                        empStats[w].commission += commShare;
                        empStats[w].revenueServed += revShare;
                    });
                });
                const chartEmpRevenue = Object.values(empStats).sort((a, b) => b.commission - a.commission).slice(0, 10);
                const employeePerformance = Object.values(empStats).map(e => ({
                    ...e,
                    commPerTicket: e.tickets ? e.commission / e.tickets : 0
                })).sort((a, b) => b.tickets - a.tickets);

                // --- 5. Peak Hours ---
                const fmtHour = (h) => h === 0 ? '12am' : h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h - 12}pm`;
                const getJuarezHour = (date) => {
                    const h = parseInt(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Ciudad_Juarez', hour: 'numeric', hour12: false }).format(date), 10);
                    return isNaN(h) || h === 24 ? 0 : h;
                };
                const hourlyBuckets = Array.from({ length: 24 }, (_, h) => ({ hour: fmtHour(h), tickets: 0, revenue: 0 }));
                fTickets.forEach(t => {
                    const b = hourlyBuckets[getJuarezHour(t.date)];
                    b.tickets += 1;
                    b.revenue += (t.price || 0);
                });
                const chartHourly = hourlyBuckets.slice(6, 19);

                // --- 6. Day-of-Week Pattern ---
                const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                const dowBuckets = Array.from({ length: 7 }, (_, i) => ({ day: dayNames[i], tickets: 0, revenue: 0 }));
                const dowDates = Array.from({ length: 7 }, () => new Set());
                fTickets.forEach(t => {
                    const d = t.date.getDay();
                    dowBuckets[d].tickets += 1;
                    dowBuckets[d].revenue += (t.price || 0);
                    dowDates[d].add(t.date.toDateString());
                });
                dowBuckets.forEach((b, i) => {
                    b.avgTickets = dowDates[i].size > 0 ? b.tickets / dowDates[i].size : 0;
                });
                const chartDOW = dowBuckets;

                // --- 7. Attendance data ---
                const attendanceByEmployee = {};
                const dailyRevMap = {};
                fTickets.forEach(t => {
                    const key = `${t.date.getFullYear()}-${String(t.date.getMonth() + 1).padStart(2, '0')}-${String(t.date.getDate()).padStart(2, '0')}`;
                    dailyRevMap[key] = (dailyRevMap[key] || 0) + (t.price || 0);
                });

                // Revenue vs staff per day (scatter: each point = one day)
                const chartRevenueVsStaff = [];
                attendance.forEach(dayRecord => {
                    const dateObj = new Date((dayRecord.date || dayRecord.id) + 'T12:00:00');
                    if (!filterDate({ date: dateObj })) return;
                    const dateKey = dayRecord.date || dayRecord.id;
                    const empCount = Object.values(dayRecord.records || {}).filter(Boolean).length;
                    Object.entries(dayRecord.records || {}).forEach(([empName, present]) => {
                        if (present) attendanceByEmployee[empName] = (attendanceByEmployee[empName] || 0) + 1;
                    });
                    const revenue = dailyRevMap[dateKey] || 0;
                    if (empCount > 0 || revenue > 0) {
                        chartRevenueVsStaff.push({ employees: empCount, revenue: Math.round(revenue), date: dateKey });
                    }
                });

                // Commission per day worked (efficiency ranking)
                const chartCommPerDay = Object.entries(empStats)
                    .map(([name, stats]) => {
                        const days = attendanceByEmployee[name] || 0;
                        return { name, commPerDay: days > 0 ? Math.round(stats.commission / days) : 0, days };
                    })
                    .filter(e => e.days > 0)
                    .sort((a, b) => b.commPerDay - a.commPerDay)
                    .slice(0, 10);

                return {
                    totalRevenue, totalExpenses, netProfit, profitMarginPct, avgTicket, ticketCount: fTickets.length,
                    avgTicketsPerDay, daysInRange, avgDailyRevenue, avgMonthlyRevenue,
                    laborCommission, laborSalary, supervisorSalesCommTotal, boleroCommTotal, totalLabor,
                    laborCommPct, laborSalaryPct, laborSupCommPct, laborBoleroCommPct, totalLaborPct,
                    totalOpExpenses, totalOpExpensesPct,
                    operatingExpenses, operatingExpensesPct, extraordinaryTotal, extraordinaryPct,
                    expenseCategories, extraordinaryCategories,
                    serviceMix, sizeMix, topVehicles,
                    extrasMix, upsellRate, extrasRevenue, extraPerTicket, ticketsWithExtras,
                    manualExtras, manualExtrasTotal,
                    snacks,
                    employeePerformance,
                    armorAllPerWash, totalArmorAllCost, salariedCount,
                    chartFinancials, chartExpenses, chartEmpRevenue,
                    chartRevenueVsStaff, chartCommPerDay,
                    chartHourly, chartDOW, chartDailyTrends, topGastos
                };

            }, [tickets, expenses, bizExpenses, cashCounts, employees, attendance, deductions, dateFilterType, selectedMonth, selectedYear, startDate, endDate]);

            if (!isAuthenticated) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-100 p-4">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
                            <div className="flex justify-center mb-6">
                                <div className="bg-slate-100 p-4 rounded-full">
                                    <Lock size={32} className="text-slate-600" />
                                </div>
                            </div>
                            <input
                                type="password"
                                value={passwordInput}
                                onChange={(e) => setPasswordInput(e.target.value)}
                                placeholder="Contraseña"
                                className="w-full border p-4 rounded-xl mb-4 bg-slate-50 focus:bg-white transition-colors"
                                autoFocus
                            />
                            <button type="submit" className="w-full bg-slate-900 text-white p-4 rounded-xl font-bold hover:bg-slate-800 transition-colors shadow-lg shadow-slate-200">
                                ENTRAR
                            </button>
                        </form>
                    </div>
                );
            }

            if (loading) return (
                <div className="flex h-screen items-center justify-center text-slate-500">
                    <Activity className="animate-spin mr-2" /> Cargando inteligencia de negocio...
                </div>
            );

            if (!processed) return <div className="p-10 text-center">No hay datos disponibles.</div>;

            const filterOptions = [
                { id: 'MONTH', label: 'Mes' },
                { id: 'YEAR', label: 'Año' },
                { id: 'CUSTOM', label: 'Rango' },
                { id: 'ALL', label: 'Todo' }
            ];

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-2">
                                <Activity className="text-blue-600" /> Dashboard Gerencial
                            </h1>
                        </div>

                        {/* THEMED DATE SELECTION MENU */}
                        <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm w-full md:w-auto">

                            {/* Toggle Pills */}
                            <div className="flex bg-slate-100 p-1 rounded-lg w-full sm:w-auto">
                                {filterOptions.map(option => (
                                    <button
                                        key={option.id}
                                        onClick={() => setDateFilterType(option.id)}
                                        className={`flex-1 sm:flex-none px-3 py-1.5 text-sm font-semibold rounded-md transition-all ${dateFilterType === option.id ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'}`}
                                    >
                                        {option.label}
                                    </button>
                                ))}
                            </div>

                            {/* Dynamic Filter Inputs */}
                            <div className="flex items-center gap-2 px-1 w-full sm:w-auto">
                                {dateFilterType === 'MONTH' && (
                                    <>
                                        <div className="relative">
                                            <select
                                                value={selectedMonth}
                                                onChange={(e) => setSelectedMonth(Number(e.target.value))}
                                                className="appearance-none bg-white border border-slate-200 text-slate-700 py-2 pl-3 pr-8 rounded-lg text-sm font-semibold hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer w-full h-10"
                                            >
                                                {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                                            </div>
                                        </div>
                                        <div className="relative">
                                            <select
                                                value={selectedYear}
                                                onChange={(e) => setSelectedYear(Number(e.target.value))}
                                                className="appearance-none bg-white border border-slate-200 text-slate-700 py-2 pl-3 pr-8 rounded-lg text-sm font-semibold hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer w-full h-10"
                                            >
                                                {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                                            </div>
                                        </div>
                                    </>
                                )}

                                {dateFilterType === 'YEAR' && (
                                    <div className="relative w-full sm:w-auto">
                                        <select
                                            value={selectedYear}
                                            onChange={(e) => setSelectedYear(Number(e.target.value))}
                                            className="appearance-none bg-white border border-slate-200 text-slate-700 py-2 pl-3 pr-8 rounded-lg text-sm font-semibold hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer w-full sm:w-32 h-10"
                                        >
                                            {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                                        </select>
                                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                            <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                                        </div>
                                    </div>
                                )}

                                {dateFilterType === 'CUSTOM' && (
                                    <CustomDateRangePicker
                                        startDate={startDate}
                                        endDate={endDate}
                                        setStartDate={setStartDate}
                                        setEndDate={setEndDate}
                                    />
                                )}
                            </div>
                        </div>
                    </header>

                    {/* SECTION 1: FINANCIAL HEALTH */}
                    <div>
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2"><PiggyBank size={20} /> Estatus Financiero</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-6">
                            <KPICard
                                title="Ingreso Bruto"
                                value={formatCurrency(processed.totalRevenue)}
                                subtext={`${formatInt(processed.ticketCount)} vehículos en ${processed.daysInRange} días`}
                                icon={DollarSign}
                                color="blue"
                            />
                            <KPICard
                                title="Nómina"
                                value={formatCurrency(processed.totalLabor)}
                                subtext={`${processed.totalLaborPct.toFixed(1)}% de Ingreso`}
                                icon={Users}
                                color="orange"
                            />
                            <KPICard
                                title="Gastos Operativos"
                                value={formatCurrency(processed.operatingExpenses)}
                                subtext={`${processed.operatingExpensesPct.toFixed(1)}% de Ingreso`}
                                icon={ArrowDownRight}
                                color="red"
                            />
                            <KPICard
                                title="Gastos Extraordinarios"
                                value={formatCurrency(processed.extraordinaryTotal)}
                                subtext={`${processed.extraordinaryPct.toFixed(1)}% de Ingreso`}
                                icon={ShieldAlert}
                                color="pink"
                            />
                            <KPICard
                                title="Utilidad Neta Operativa"
                                value={formatCurrency(processed.netProfit)}
                                subtext={`${processed.profitMarginPct.toFixed(1)}% de Ingreso`}
                                icon={Wallet}
                                color={processed.netProfit > 0 ? "green" : "red"}
                            />
                        </div>

                        {/* SECONDARY METRICS: AVERAGES & ARMOR ALL */}
                        <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-6">
                            <KPICard
                                title="Ticket Promedio"
                                value={formatCurrency(processed.avgTicket)}
                                subtext="Ingreso por auto"
                                icon={TrendingUp}
                                color="purple"
                            />
                            <KPICard
                                title="Autos por Día"
                                value={processed.avgTicketsPerDay.toFixed(1)}
                                subtext="Promedio diario"
                                icon={Car}
                                color="cyan"
                            />
                            <KPICard
                                title="Promedio Diario"
                                value={formatCurrency(processed.avgDailyRevenue)}
                                subtext="Ingreso por día"
                                icon={Calendar}
                                color="blue"
                            />
                            <KPICard
                                title="Promedio Mensual"
                                value={formatCurrency(processed.avgMonthlyRevenue)}
                                subtext="Proyección a 30.4 días"
                                icon={Calendar}
                                color="indigo"
                            />

                                            <th className="p-3">Coincide con</th>
                                            <th className="p-3 text-right">Veces</th>
                                            <th className="p-3 text-right">Ingresos</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processed.manualExtras.map((m, i) => (
                                            <tr key={i} className="border-b last:border-0 hover:bg-slate-50">
                                                <td className="p-3 font-medium text-slate-800">"{m.label}"</td>
                                                <td className="p-3">{m.matchedId
                                                    ? <span className="inline-block px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700">{EXTRA_LABELS[m.matchedId] || m.matchedId} — usar el botón</span>
                                                    : <span className="text-slate-400 text-xs">Cargo genuino</span>}
                                                </td>
                                                <td className="p-3 text-right text-slate-600">{formatInt(m.count)}</td>
                                                <td className="p-3 text-right font-bold text-slate-800">{formatCurrency(m.revenue)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr className="bg-slate-50 font-bold text-slate-800">
                                            <td className="p-3">TOTAL MANUAL</td>
                                            <td className="p-3"></td>
                                            <td className="p-3 text-right">{formatInt(processed.manualExtras.reduce((a, m) => a + m.count, 0))}</td>
                                            <td className="p-3 text-right">{formatCurrency(processed.manualExtrasTotal)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* NEW SECTION: DAILY TRENDS */}
                    <div>
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2 mt-8"><Activity size={20} /> Tendencias Diarias</h2>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Tickets Diarios</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={processed.chartDailyTrends}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="dateLabel" style={{ fontSize: '10px' }} />
                                        <YAxis />
                                        <Tooltip />
                                        <Line type="monotone" dataKey="tickets" stroke="#8b5cf6" strokeWidth={2} name="Tickets" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Venta Diaria</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={processed.chartDailyTrends}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="dateLabel" style={{ fontSize: '10px' }} />
                                        <YAxis tickFormatter={(val) => `$${val / 1000}k`} />
                                        <Tooltip formatter={(val) => formatCurrency(val)} />
                                        <Line type="monotone" dataKey="venta" stroke="#10b981" strokeWidth={2} name="Venta" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Pinos Vendidos Diarios</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={processed.chartDailyTrends}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="dateLabel" style={{ fontSize: '10px' }} />
                                        <YAxis />
                                        <Tooltip />
                                        <Line type="monotone" dataKey="pinos" stroke="#f59e0b" strokeWidth={2} name="Pinos" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Snacks Vendidos Diarios</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={processed.chartDailyTrends}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="dateLabel" style={{ fontSize: '10px' }} />
                                        <YAxis />
                                        <Tooltip />
                                        <Line type="monotone" dataKey="snacks" stroke="#f43f5e" strokeWidth={2} name="Snacks" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* SECTION 3: SCHEDULING */}
                    <div>
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2 mt-8"><Clock size={20} /> Día y Hora</h2>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Autos por Hora del Día</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={processed.chartHourly}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="hour" style={{ fontSize: '11px' }} />
                                        <YAxis allowDecimals={false} />
                                        <Tooltip />
                                        <Bar dataKey="tickets" fill="#3b82f6" radius={[4, 4, 0, 0]} name="Autos" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Ingresos por Hora del Día</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={processed.chartHourly}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="hour" style={{ fontSize: '11px' }} />
                                        <YAxis tickFormatter={(val) => `$${val / 1000}k`} style={{ fontSize: '10px' }} />
                                        <Tooltip formatter={(val) => formatCurrency(val)} />
                                        <Bar dataKey="revenue" fill="#10b981" radius={[4, 4, 0, 0]} name="Ingresos" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Autos por Día de la Semana</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={processed.chartDOW}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="day" style={{ fontSize: '12px' }} />
                                        <YAxis allowDecimals={false} />
                                        <Tooltip />
                                        <Bar dataKey="tickets" fill="#8b5cf6" radius={[4, 4, 0, 0]} name="Autos" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-80">
                                <h3 className="font-bold text-slate-700 mb-4">Ingresos por Día de la Semana</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={processed.chartDOW}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="day" style={{ fontSize: '12px' }} />
                                        <YAxis tickFormatter={(val) => `$${val / 1000}k`} style={{ fontSize: '10px' }} />
                                        <Tooltip formatter={(val) => formatCurrency(val)} />
                                        <Bar dataKey="revenue" fill="#10b981" radius={[4, 4, 0, 0]} name="Ingresos" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* DAY OF WEEK TABLE */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border overflow-x-auto mt-6">
                            <h3 className="font-bold text-slate-700 mb-4">Resumen por Día de la Semana</h3>
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 border-b">
                                    <tr>
                                        <th className="p-3">Día</th>
                                        <th className="p-3 text-right">Tickets</th>
                                        <th className="p-3 text-right">Tickets/Día</th>
                                        <th className="p-3 text-right">Ingresos</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...processed.chartDOW].sort((a, b) => b.revenue - a.revenue).map(d => (
                                        <tr key={d.day} className="border-b last:border-0 hover:bg-slate-50">
                                            <td className="p-3 font-medium text-slate-800">{d.day}</td>
                                            <td className="p-3 text-right text-slate-600">{formatInt(d.tickets)}</td>
                                            <td className="p-3 text-right text-slate-600">{d.avgTickets > 0 ? d.avgTickets.toFixed(1) : '—'}</td>
                                            <td className="p-3 text-right font-bold text-slate-800">{d.revenue > 0 ? formatCurrency(d.revenue) : 'Cerrado'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* SECTION 4: STAFF */}
                    <div>
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2 mt-8"><Users size={20} /> Desempeño del Personal</h2>

                        {/* EMPLOYEE PERFORMANCE TABLE */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border overflow-x-auto mb-6">
                            <h3 className="font-bold text-slate-700 mb-1">Desempeño de Lavadores</h3>
                            <p className="text-xs text-slate-400 mb-4">Tickets y comisión repartidos en partes iguales cuando un ticket tiene varios lavadores. "Ingresos Servidos" es la parte proporcional de la venta atendida.</p>
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 border-b">
                                    <tr>
                                        <th className="p-3">Lavador</th>
                                        <th className="p-3 text-right">Tickets</th>
                                        <th className="p-3 text-right">Comisión Total</th>
                                        <th className="p-3 text-right">Comisión / Ticket</th>
                                        <th className="p-3 text-right">Ingresos Servidos</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {processed.employeePerformance.length === 0 ? (
                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400">Sin tickets con lavadores asignados.</td></tr>
                                    ) : processed.employeePerformance.map(e => (
                                        <tr key={e.name} className="border-b last:border-0 hover:bg-slate-50">
                                            <td className="p-3 font-medium text-slate-800">{e.name}</td>
                                            <td className="p-3 text-right text-slate-600">{formatInt(e.tickets)}</td>
                                            <td className="p-3 text-right font-bold text-slate-800">{formatCurrency(e.commission)}</td>
                                            <td className="p-3 text-right text-slate-600">{formatCurrency(e.commPerTicket)}</td>
                                            <td className="p-3 text-right font-bold text-blue-700">{formatCurrency(e.revenueServed)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border h-96">
                                <h3 className="font-bold text-slate-700 mb-4">Comisión Total por Empleado</h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={processed.chartEmpRevenue} layout="vertical" margin={{ left: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} />
                                        <XAxis type="number" tickFormatter={(val) => `$${(val / 1000).toFixed(0)}k`} style={{ fontSize: '10px' }} />
                                        <YAxis dataKey="name" type="category" width={150} style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        <Tooltip formatter={(val) => formatCurrency(val)} />
                                        <Bar dataKey="commission" fill="#6366f1" radius={[0, 4, 4, 0]} name="Comisión" barSize={20} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow-sm border h-96">
                                <h3 className="font-bold text-slate-700 mb-1">Comisión Promedio por Día Trabajado</h3>
                                <p className="text-xs text-slate-400 mb-3">Cuánto gana cada empleado en promedio por cada día que asiste. Mide eficiencia, no solo volumen.</p>
                                <ResponsiveContainer width="100%" height="85%">
                                    <BarChart data={processed.chartCommPerDay} layout="vertical" margin={{ left: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} />
                                        <XAxis type="number" tickFormatter={(val) => `$${(val / 1000).toFixed(1)}k`} style={{ fontSize: '10px' }} />
                                        <YAxis dataKey="name" type="category" width={150} style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        <Tooltip formatter={(val, name) => name === 'Comisión/día' ? formatCurrency(val) : val} labelFormatter={(label) => label} />
                                        <Bar dataKey="commPerDay" fill="#f59e0b" radius={[0, 4, 4, 0]} name="Comisión/día" barSize={20} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border h-96">
                            <h3 className="font-bold text-slate-700 mb-1">Impacto de Asistencia en Ventas del Día</h3>
                            <p className="text-xs text-slate-400 mb-4">Cada punto es un día. Eje X = empleados presentes ese día. Eje Y = venta total. Tendencia hacia arriba = más personal genera más ingresos.</p>
                            <ResponsiveContainer width="100%" height="80%">
                                <ScatterChart margin={{ top: 10, right: 20, bottom: 20, left: 10 }}>
                                    <CartesianGrid strokeDasharray="3 3" />
                                    <XAxis type="number" dataKey="employees" name="Empleados" allowDecimals={false} label={{ value: 'Empleados presentes', position: 'insideBottom', offset: -12, style: { fontSize: '11px', fill: '#94a3b8' } }} style={{ fontSize: '11px' }} />
                                    <YAxis type="number" dataKey="revenue" name="Venta" tickFormatter={(v) => `$${(v / 1000).toFixed(0)}k`} style={{ fontSize: '10px' }} />
                                    <Tooltip cursor={{ strokeDasharray: '3 3' }} content={({ payload }) => {
                                        if (!payload || !payload.length) return null;
                                        const d = payload[0].payload;
                                        return (
                                            <div className="bg-white border border-slate-200 rounded-lg p-3 shadow text-sm">
                                                <div className="font-bold text-slate-700">{d.date}</div>
                                                <div className="text-slate-500">{d.employees} empleados</div>
                                                <div className="text-blue-600 font-bold">{formatCurrency(d.revenue)}</div>
                                            </div>
                                        );
                                    }} />
                                    <Scatter data={processed.chartRevenueVsStaff} fill="#3b82f6" opacity={0.65} />
                                </ScatterChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<AnalyticsDashboard />);
    </script>
</body>

</html>
